name: Painel Dev (site e APK)

# Verifica (chaves, testes, tipos, build), publica o site no GitHub Pages e gera o APK Dev (release dev-1.N).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: painel
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run chaves && npm run test && npm run typecheck
      - name: Gerar o site (Pages)
        run: npm run build
        env:
          BASE_URL: /vetorial-dev-center/
          VITE_BUILD: ${{ github.run_number }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/painel-dev/dist

  site:
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - id: pages
        uses: actions/deploy-pages@v4

  apk:
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install --no-audit --no-fund
      - name: Preparar o projeto Android
        working-directory: apps/painel-dev
        run: |
          npm run android:add
          npm run build:apk
        env:
          VITE_BUILD: ${{ github.run_number }}
      - name: Compilar o APK
        working-directory: apps/painel-dev/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      # Com a chave de assinatura do repositório (segredos ASSINATURA_BASE64 e ASSINATURA_SENHA), cada versão atualiza a anterior.
      - name: Assinar o APK
        env:
          ASSINATURA_BASE64: ${{ secrets.ASSINATURA_BASE64 }}
          SENHA: ${{ secrets.ASSINATURA_SENHA }}
        run: |
          cd apps/painel-dev/android/app/build/outputs/apk/debug
          cp app-debug.apk VenusDev.apk
          if [ -n "$ASSINATURA_BASE64" ] && [ -n "$SENHA" ]; then
            echo "$ASSINATURA_BASE64" | base64 -d > "$RUNNER_TEMP/dev.keystore"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/dev.keystore" --ks-key-alias venus --ks-pass env:SENHA --key-pass env:SENHA VenusDev.apk
            "$BT/apksigner" verify VenusDev.apk
            shred -u "$RUNNER_TEMP/dev.keystore"
          else
            echo "::warning::Sem a chave de assinatura: o APK sai com a chave de teste (para atualizar, desinstale o anterior)."
          fi
          rm -f app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: venus-painel-dev-apk
          path: apps/painel-dev/android/app/build/outputs/apk/debug/VenusDev.apk

  publicar:
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: venus-painel-dev-apk
          path: apk
      - name: Publicar a versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "dev-1.${{ github.run_number }}" apk/VenusDev.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Vetorial Dev 1.${{ github.run_number }}" --notes "APK do Painel Dev (administrador). Baixe VenusDev.apk e toque nele para instalar."
