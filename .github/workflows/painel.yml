name: Painel Dev (site e APK)

# Verifica (chaves, testes, tipos, build), publica o site no GitHub Pages e gera o APK Dev (release dev-1.N).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: painel
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run chaves && npm run test && npm run typecheck
      - name: Gerar o site (Pages)
        run: npm run build
        env:
          BASE_URL: /vetorial-dev-center/
          VITE_BUILD: ${{ github.run_number }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/painel-dev/dist

  site:
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - id: pages
        uses: actions/deploy-pages@v4

  apk:
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install --no-audit --no-fund
      - name: Preparar o projeto Android
        working-directory: apps/painel-dev
        run: |
          npm run android:add
          npm run build:apk
        env:
          VITE_BUILD: ${{ github.run_number }}
      # O Capacitor não trata o "voltar" do aparelho: sem isto o app fecha. Aqui ele anda no histórico (abas) e só sai na última tela.
      - name: Voltar do aparelho volta uma tela
        run: |
          d=apps/painel-dev/android/app/src/main/java/com/vetorialtech/venus/dev
          mkdir -p "$d"
          cat > "$d/MainActivity.java" <<'JAVA'
          package com.vetorialtech.venus.dev;

          import android.os.Bundle;
          import android.webkit.WebView;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          WebView w = getBridge() == null ? null : getBridge().getWebView();
                          if (w != null && w.canGoBack()) { w.goBack(); return; }
                          setEnabled(false);
                          getOnBackPressedDispatcher().onBackPressed();
                      }
                  });
              }
          }
          JAVA
      - name: Compilar o APK
        working-directory: apps/painel-dev/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      # A chave de assinatura fica guardada (cifrada) no servidor da Vênus: cada versão instala por cima da anterior, sem desinstalar.
      - name: Assinar o APK
        run: |
          cd apps/painel-dev/android/app/build/outputs/apk/debug
          cp app-debug.apk VenusDev.apk
          rm -f app-debug.apk
          bash "$GITHUB_WORKSPACE/.github/assinar-apk.sh" VenusDev.apk
      - uses: actions/upload-artifact@v4
        with:
          name: venus-painel-dev-apk
          path: apps/painel-dev/android/app/build/outputs/apk/debug/VenusDev.apk

  windows:
    needs: verificar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gerar o instalador do Windows
        working-directory: desktop
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: venus-painel-dev-windows
          path: desktop/dist/VetorialDev-Setup.exe
          if-no-files-found: error

  publicar:
    needs: [apk, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: venus-painel-dev-apk
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: venus-painel-dev-windows
          path: apk
      - name: Publicar a versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "dev-1.${{ github.run_number }}" apk/VenusDev.apk apk/VetorialDev-Setup.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Vetorial Dev 1.${{ github.run_number }}" --notes "APK do Painel Dev (administrador). Android: baixe VenusDev.apk e toque nele. Windows: VetorialDev-Setup.exe instala com atalho na área de trabalho."
