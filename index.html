<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetorial Tech | Supreme Dev Center</title>
    <style>
        :root {
            --bg-gunmetal: #121417;
            --panel-gunmetal: #1A1D23;
            --border-gunmetal: #2C323D;
            --gold-supreme: #FFD700;
            --gold-glow: rgba(255, 215, 0, 0.2);
            --text-main: #E2E8F0;
            --text-muted: #94A3B8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-gunmetal);
            color: var(--text-main);
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 24px 0;
            border-bottom: 1px solid var(--border-gunmetal);
            margin-bottom: 20px;
        }

        .logo-badge {
            width: 70px;
            height: 70px;
            margin: 0 auto 12px auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #1A1D23, #2C323D);
            border: 2px solid var(--gold-supreme);
            box-shadow: 0 0 15px var(--gold-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        h1 {
            font-size: 20px;
            color: var(--gold-supreme);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .card {
            background-color: var(--panel-gunmetal);
            border: 1px solid var(--border-gunmetal);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-gunmetal);
            padding-bottom: 8px;
        }

        .card-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-main);
        }

        .status-pill {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: bold;
            background: rgba(255, 215, 0, 0.1);
            color: var(--gold-supreme);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        ul {
            list-style: none;
        }

        li {
            font-size: 13px;
            color: var(--text-muted);
            padding: 6px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        li:last-child {
            border-bottom: none;
        }

        li::before {
            content: "▪";
            color: var(--gold-supreme);
        }

        .refresh-btn {
            width: 100%;
            background: linear-gradient(135deg, #B8860B, var(--gold-supreme));
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 10px var(--gold-glow);
            text-transform: uppercase;
        }

        .refresh-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-badge">👑</div>
        <h1>Vetorial Tech</h1>
        <div class="subtitle">Supreme Dev Command Center</div>
    </header>

    <div id="app-container">
        <div class="card">
            <p style="text-align: center; color: var(--text-muted);">Carregando central de dados...</p>
        </div>
    </div>

    <button class="refresh-btn" onclick="loadRoadmap()">Atualizar Painel</button>

    <script>
        async function loadRoadmap() {
            const container = document.getElementById('app-container');
            try {
                // Busca o arquivo JSON direto do seu repositório do GitHub
                const response = await fetch('roadmap.json?_=' + new Date().getTime());
                const data = await response.json();
                
                let html = '';
                data.modules.forEach(mod => {
                    let stepsHtml = mod.steps.map(step => `<li>${step}</li>`).join('');
                    html += `
                        <div class="card">
                            <div class="card-header">
                                <span class="card-title" style="border-left: 4px solid ${mod.brand_color}; padding-left: 8px;">${mod.name}</span>
                                <span class="status-pill">${mod.status}</span>
                            </div>
                            <ul>
                                ${stepsHtml}
                            </ul>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = `<div class="card"><p style="color: #ff6b6b; text-align: center;">Erro ao carregar os dados. Verifique se o roadmap.json está no repositório.</p></div>`;
            }
        }

        // Carrega ao abrir
        loadRoadmap();
    </script>
</body>
</html>
